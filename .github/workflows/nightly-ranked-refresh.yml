name: Nightly ranked refresh

# RecOsuk nightly ranked refresh (batch AO).
# Runs the repo script once a day; the script finds stale/missing ranked
# cards and calls the Supabase Edge Function action `refreshRanked` once
# per stale card. The function does the compiling and storing.
# Schedule: 07:00 Asia/Saigon = 00:00 UTC (GitHub cron runs in UTC).
# `workflow_dispatch` lets you run it manually from the Actions tab to test.
#
# Setup (once, in the GitHub web UI — the connector cannot push .github/ files):
#   1. Repo → Actions → New workflow → paste this file → Commit.
#      (Or: Add file → Create new file → path
#       .github/workflows/nightly-ranked-refresh.yml → paste → Commit.)
#   2. Repo → Settings → Secrets and variables → Actions → New repository
#      secret, add these three (names must match exactly):
#        SUPABASE_URL           (your project URL)
#        SUPABASE_ANON_KEY      (the publishable key from Supabase Settings → API)
#        RANKED_REFRESH_TOKEN   (the token from the batch AO handover)
#   3. In Supabase, the function must be deployed with the same refresh
#      token set as a secret (supabase secrets set + functions deploy),
#      or every run will fail with 401.

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh stale ranked cards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RANKED_REFRESH_TOKEN: ${{ secrets.RANKED_REFRESH_TOKEN }}
        run: node scripts/nightly-ranked-refresh.mjs
